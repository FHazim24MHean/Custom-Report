<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Custom Report Generator</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <p class="eyebrow">Electrical reporting</p>
      <h1>Sign in to reports</h1>
      <p class="intro">Use the report account provided by your administrator.</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="loginError" class="error" role="alert" aria-live="polite"></p>
        <button id="loginButton" type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
